name: news_reader_app
description: "A production-grade Material 3 News Reader Android application built with Flutter & Provider."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.35.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.2
  # HTTP Client for Public News API
  http: ^1.3.0
  # Local Device Persistence
  shared_preferences: ^2.5.2
  # Date formatting & internationalization
  intl: ^0.20.2
  # Safe external link launching
  url_launcher: ^6.3.1
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
